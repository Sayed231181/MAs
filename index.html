<style>
:root{--bg:#0c1914;--cd:#14302a;--tx:#f1f5f3;--mu:#9fb8ae;--nv:#123d33;--am:#f0a94a;--bd:#24463d;--bad:#ff8a80;--ok:#6fe0a6;color-scheme:dark}
:root:not([data-theme="light"]){}

:root[data-theme="dark"]{--bg:#0d141b;--cd:#16212b;--tx:#e6edf3;--mu:#92a3b3;--bd:#27343f;--bad:#f97066;--ok:#47cd89;--nv:#08182d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Bahnschrift","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px))}
header{background:var(--nv);color:#fff;padding:12px 14px 14px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
h1{font-size:17px;margin:0;font-weight:600}#st{font-size:12px;color:#cfd9e4}
.ctl{display:flex;gap:8px}
select,input,textarea{font:inherit;color:inherit}
header select{flex:1;min-width:0;background:#ffffff18;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:8px}header option{color:#000}
main{padding:12px 14px;max-width:640px;margin:0 auto}
.sum{background:linear-gradient(160deg,#18473b,#0f2a23);color:#fff;border-radius:22px;padding:18px;margin-bottom:4px}
.sum .big{font-size:28px;font-weight:700;color:var(--am);line-height:1.1}
.sum .g{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px;font-size:13px;color:#cfd9e4}.sum b{color:#fff;font-weight:600}
.cd{background:var(--cd);border:0;border-radius:18px;padding:14px 16px;margin-bottom:0;font-size:16px}
.r{display:flex;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}.g2{margin:6px 0;padding-top:6px;border-top:1px solid var(--bd)}
.bad{color:var(--bad)}.ok{color:var(--ok)}.empty{text-align:center;color:var(--mu);padding:36px 10px}
.pl{background:var(--cd);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px;font:inherit;width:100%;margin-bottom:8px}
h2{font-size:15px;margin:16px 0 8px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:16px}
.grid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.grid>*{width:100%}
.grid>.sum,.grid>.cd,.grid>h2,.grid>.wide,.grid>.mu{width:100%}
.grid .ln{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:var(--cd);border:0;border-radius:12px;font-size:15px;color:var(--mu)}
.grid .ln>span:last-child{font-size:17px;font-weight:700;color:var(--tx);text-align:right}
.grid .ln input{width:150px;text-align:right;font-size:17px}
.grid .ln.t{background:var(--nv);color:#fff}
.grid .ln.t>span:last-child{color:var(--am)}
.ln input{width:150px;text-align:right;padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--cd)}
.ln.t{font-weight:700;border:0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px 2px;font:inherit;font-size:13px;color:var(--mu)}nav button.on{color:var(--tx);font-weight:700;box-shadow:inset 0 3px var(--am)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:27px;border:0;background:var(--am);color:#1b1200;font-size:30px;box-shadow:0 3px 10px #0004}
dialog{border:0;border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:640px;margin:auto auto 0;background:var(--cd);color:var(--tx);max-height:92vh}dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
dialog input,dialog select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pv{background:var(--bg);border-radius:8px;padding:10px;margin:12px 0;font-size:14px}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:12px;border-radius:8px;border:1px solid var(--bd);font:inherit;background:var(--bg);color:var(--tx)}.btns .p{background:var(--nv);color:#fff;border:0;font-weight:600;flex:2}
#toast{position:fixed;left:14px;right:14px;bottom:calc(130px + env(safe-area-inset-bottom,0px));background:#14212b;color:#fff;padding:10px 12px;border-radius:8px;display:none;z-index:9}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<header><div class="top"><div style="display:flex;align-items:center;gap:10px"><img id="hlogo" alt="" style="height:52px;background:#fff;border-radius:8px;padding:2px"><div><h1>MAS Ekspedisi</h1><div style="font-size:13px;color:#9fb8ae">PT. Mitra Abadi Safa</div></div></div><span id="st"></span></div>
<div class="ctl" id="ctl"><select id="sy" style="max-width:110px"><option value="2026">2026</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option><option value="2030">2030</option></select><select id="sb"></select><select id="sh"><option value="1">Tgl 1–15</option><option value="2">Tgl 16–akhir</option></select></div></header>
<main id="app"></main><div id="toast"></div>
<button class="fab" id="fab" onclick="S.tab=='bms'?openG():openF()" aria-label="Tambah">+</button>
<nav><button id="n_home" onclick="tab('home')">Beranda</button><button id="n_bmr" onclick="tab('bmr')">Transaksi</button><button id="n_bms" onclick="tab('bms')">Keuangan</button><button id="n_lap" onclick="tab('lap')">Laporan</button><button id="n_bak" onclick="tab('bak')">Lainnya</button></nav>
<dialog id="lg" oncancel="event.preventDefault()"><b>Masuk</b><label>Email</label><input id="l_em" type="email" autocomplete="username"><label>Kata sandi</label><input id="l_pw" type="password" autocomplete="current-password"><div id="l_err" class="bad" style="margin-top:8px"></div><div class="btns" style="margin-top:14px"><button class="p" onclick="masuk()">Masuk</button></div></dialog>
<dialog id="dlg"><b id="ft"></b> <button id="baru" onclick="transaksiBaru()" style="float:right;padding:6px 12px;border:0;border-radius:10px;background:#2c5b4e;color:#fff;font-weight:700">Transaksi baru</button>
<div class="two"><div><label>Tanggal</label><input type="date" id="f_tgl"></div><div><label>Pengirim</label><select id="f_pengirim" onchange="pengirimCek()"></select><input id="f_pengirim2" placeholder="ketik nama pengirim" style="display:none;margin-top:6px"></div></div>
<div class="two" id="pabrikrow" style="display:none"><div><label>Pabrik pakan (pilih atau ketik)</label><input id="f_pabrik" list="dpab"></div><div></div></div>
<div class="two"><div><label>Plat mobil</label><select id="f_plat" onchange="autoS()"></select><input id="f_plat2" placeholder="ketik plat mobil" style="display:none;margin-top:6px"></div><div><label>Nama sopir</label><select id="f_sopir" onchange="selCek('#f_sopir','#f_sopir2')"></select><input id="f_sopir2" placeholder="ketik nama sopir" style="display:none;margin-top:6px"></div></div>
<div class="two"><div><label>Harga per kg (Rp)</label><input type="text" inputmode="text" id="f_harga" oninput="prev()"></div><div><label>Ongkos per kg (Rp)</label><input type="text" inputmode="text" id="f_d"></div></div>
<div class="two"><div><label>Biaya mutasi (Rp)</label><input type="text" inputmode="text" id="f_mutasi" oninput="prev()"></div><div><label>Mobil Yed (Rp)</label><input type="text" inputmode="text" id="f_f"></div></div>
<label style="margin-top:10px;font-weight:700">Isi setiap pengiriman</label>
<div class="two"><div><label>Merek – jenis pakan</label><input id="f_merek" list="dm"></div><div><label>Tujuan</label><select id="f_tujuan" onchange="selCek('#f_tujuan','#f_tujuan2')"></select><input id="f_tujuan2" placeholder="ketik tujuan" style="display:none;margin-top:6px"></div></div>
<label>Jumlah karung</label><input type="text" inputmode="text" id="f_karung" oninput="prev()">
<label>Keterangan</label><input id="f_ket"><div class="pv" id="pv"></div>
<div class="btns"><button id="del" onclick="hapus()">Hapus</button><button onclick="dlg.close()">Batal</button><button class="p" onclick="simpan()">Simpan</button></div>
<datalist id="dm"></datalist><datalist id="dt"></datalist><datalist id="dp"></datalist><datalist id="dsop"></datalist><datalist id="dpab"><option>PHOKPHAN</option><option>NEW HOPE</option><option>MALINDO</option><option>INDO JAYA</option><option>MABAR</option><option>GOLD COIN</option></datalist></dialog>
<dialog id="dg"><b id="gt"></b>
<label>Tanggal (boleh kosong)</label><input type="date" id="g_tgl">
<label>Jenis</label><select id="g_jenis"></select>
<label>Keterangan</label><input id="g_ket">
<label>Jumlah (Rp)</label><input type="text" inputmode="text" id="g_jumlah" placeholder="contoh: 500000 atau -500000">
<div class="btns" style="margin-top:14px"><button id="gdel" onclick="hapusG()">Hapus</button><button onclick="dg.close()">Batal</button><button class="p" onclick="simpanG()">Simpan</button></div></dialog>
<script>
const BLN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const MEREK="Phokpan - B511F|Phokpan - B511|Phokpan - B512G|B511F+ B511|B511+ B512G|b511F+b511+b512g|New Hope - BPS|New Hope - B11A|New Hope - B12A|B11A+B12A|BPS++B11A|Malindo - BR|Malindo - 8201|Malindo - 8202|Malindo - 9203|8201+8202|8202+9203|Indojaya - BR 0 GE|Indojaya - BR 1 GE|Indojaya - BR 2 GE|BR 0+ BR 1|BR1 + BR2|Mabar - 810|Mabar - 811C|Mabar - 812|810 + 811c|811c + 812|Gold Coin - 200C|Gold Coin -201C|Gold Coin - 202|200 C+ 201C|201C+ 202C|201 pelet spm|201 c+ 201 pelet spm".split("|");
const PLAT=[["BK 8323 FB","BG MUN"],["BK 8075 NB","Beuna Jaya"],["BK 8323 CG","ZIAN"],["BK 8344 BT","usman"],["BK 8679 GF","heri"],["BK 8591 GR","Akmal"],["BK 8551 GC","Tulang"],["BL 8808 JK","Dhonalwi"],["BL 8659 ZT","Syarifuddin"],["BL 8546 PF","zamzami"],["BL 8353 LH","Azhari"],["BL 8936","Kiki"],["BK 8661 XL","M.Nasir KP"],["BL 8954 ZP","M.Iqbal"],["BL 8891 ZP","Razali M"],["BK 8639 NH","Ridwan"],["BK 9448 TO","Sinyak"],["BK 8999 FB","BG ALI"],["Z 9281 DC","Bg pon nisam"],["BK 8587 PF","Bg yed Mahdi"]];
const TUJ="MEDAN|GUDANG|Periode Lalu|Diambil Alwi|Ambil Kantor|Abdul Somad|Azhar|Bahri|Balyani|Bukhari|Fajar|Feri|Ghani|Khairunisa|M Nasir|Mawardinur|Azis Amin|PT PMI 1|PT PMI 2|Nurdin Hasyem|Rahmayani|Ramli|Rasyid|Riza H|Saiful|Sulaiman|Syahrol|Sayed Nadariadi|Syarkawi|Fauzan|Yusri|Zulkifi|Zulfikar A|Zulfikar B|Tgk Aji Nasir|M.Fadir|Abdullah|Afwan|Andi|Azanul|Fahrurrazi|Faisal|Halim|Intan|Muhajir|Mursyid|Nazaruddin|Fikar|Firdaus|Ria|Darwanti|Ridwan|Ammar|Auliati|Idris|Jainuddin|Jamal|Liza|Feriadi|Miswari|Saifulli|Sibral|M. Arif|M.Yusuf|Cut LiLis|zulfan|Arifuddin|Muktar|Aliya|Anidar|M.Rafi|M.Ikhlas".split("|");
const JENIS=["Ambilan Abang Adi","Ongkos mutasi","Biaya operasional ekspedisi","Biaya operasional mutasi"];
const jl=j=>j=="Ongkos mutasi"?"Ongkos mobil":j;
const F=["tgl","merek","pengirim","pabrik","tujuan","plat","sopir","karung","harga","mutasi","d","f","ket"];
const NER=[["pembayaran","Total pembayaran ekspedisi"],["pajak","Total pajak 0,5%"],["ongkos","Total ongkos ekspedisi"],["fee","Fee perusahaan Mitra"],["operasional","Total biaya operasional usaha"]];
const YED=[["pendapatan","Pendapatan ekspedisi"],["sewa","Pendapatan sewa truk ekspedisi"],["mutasi","Pendapatan sewa truk mutasi"],["p10","Pendapatan ekspedisi 10%"]];
const $=s=>document.querySelector(s),dlg=$("#dlg"),dg=$("#dg");
const now=new Date();
let db=null,RO=false,ready=false,busy=false,P={},CFG={neraca:{},yed:{}};
let S={tab:"home",year:Math.min(2030,Math.max(2026,now.getFullYear())),bln:now.getFullYear()==2026?now.getMonth():0,half:now.getDate()<=15?1:2,edit:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>parseFloat(v)||0,rp=n=>"Rp "+Math.round(n||0).toLocaleString("id-ID"),fm=n=>(n||0).toLocaleString("id-ID",{maximumFractionDigits:2});
const fd=t=>t?t.slice(8)+"/"+t.slice(5,7):"–";
const calc=e=>{const ton=e.karung/20,kg=ton*1000,tag=kg*e.harga,total=tag+e.mutasi;return{ton,kg,tag,total,sisa:total-num(e.bayar)}};
const sums=es=>es.reduce((a,e)=>{const c=calc(e);a.krg+=e.karung;a.ton+=c.ton;a.tag+=c.tag;a.mut+=e.mutasi;a.bay+=num(e.bayar);a.sisa+=c.sisa;return a},{krg:0,ton:0,tag:0,mut:0,bay:0,sisa:0});
const key=t=>`${t}-${S.bln}-${S.half}`,rows=t=>(P[key(t)]||{}).rows||[];
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3500)}
async function mut(t,fn){
 if(!db||RO){toast("Tidak bisa menyimpan: sinkronisasi belum tersambung atau akses hanya baca.");return false}
 if(busy)return false;busy=true;
 try{const ref=db.doc(PC()+"/"+key(t)),s=await ref.get();const cur=s.exists?s.data():{t,b:S.bln,h:S.half,rows:[]};cur.rows=fn(cur.rows||[]);await ref.set(cur);return true}
 catch(e){toast("Gagal menyimpan ("+(e.code||"error")+"). Coba lagi.");return false}finally{busy=false}}
function tab(t){S.tab=t;render();scrollTo(0,0)}
function render(){
 $("#st").textContent=RO?"Hanya baca":db?(ready?(navigator.onLine?"Online · tersinkron":"Offline · tersimpan di HP"):"Menghubungkan…"):"Belum tersambung";
 ["home","bmr","bms","lap","bak"].forEach(k=>$("#n_"+k).className=S.tab==k?"on":"");
 const pr=S.tab=="bmr"||S.tab=="bms"||S.tab=="home";$("#ctl").style.display=pr?"":"none";$("#fab").style.display=(S.tab=="bmr"||S.tab=="bms")&&!RO?"":"none";
 $("#sb").value=S.bln;$("#sh").value=S.half;
 $("#app").innerHTML=({home:vHome,bmr:vBmr,bms:vBms,lap:vLap,bak:vBak})[S.tab]()}
function card(e){const c=calc(e);return `<div class="cd" onclick="openF('${e.id}')"><div class="r"><b>${esc(e.merek||"–")}</b><span class="mu">${fd(e.tgl)}</span></div><div class="mu">${esc((e.pengirim||"–")+(e.pabrik?" ("+e.pabrik+")":""))} → ${esc(e.tujuan||"–")}</div><div class="mu">${esc(e.plat)} ${e.sopir?"("+esc(e.sopir)+")":""}</div>${num(e.d)?"":'<div class="bad" style="font-size:12px;margin-top:4px">⚠ Ongkos per kg belum diisi</div>'}<div class="r g2"><span>${fm(e.karung)} karung = ${fm(c.ton)} ton</span><b>${rp(c.total)}</b></div>${e.bayar?`<div class="r"><span class="mu">Dibayar ${rp(e.bayar)}</span></div>`:""}</div>`}
function vHome(){const b=S.bln,h=S.half,p=P["BMR-"+b+"-"+h],q=sums((p&&p.rows)||[]),si=sisaInfo(b,h),kn=keuntunganRinci(b,h),per=`${h==1?"1–15":"16–31"} ${BLN[b]} ${S.year}`;
 const all=Object.values(P).filter(x=>x.t=="BMR");let n=0,ton=0,tag=0,by=0,pjAll=0;all.forEach(x=>{const z=sums(x.rows||[]);n+=(x.rows||[]).length;ton+=z.ton;tag+=z.tag+z.mut;by+=z.bay+num(x.bayar);pjAll+=pajakDoc(x)});
 const sisaAll=tag-by-pjAll,dibayar=by;
 const t=(v,l)=>`<div style="background:rgba(255,255,255,.07);border-radius:16px;padding:14px"><div style="font-size:24px;font-weight:700">${v}</div><div style="font-size:14px;color:#9fb8ae;margin-top:4px">${l}</div></div>`;
 return `<div class="sum" style="padding:20px"><div style="font-size:14px;letter-spacing:.5px;color:#9fb8ae;font-weight:700">PERIODE ${per.toUpperCase()}</div><div style="font-size:34px;font-weight:800;margin:8px 0 2px">${rp(q.tag+q.mut)}</div><div style="font-size:14px;color:#9fb8ae">Total tagihan ke PT periode ini</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0">${t(fm(q.ton/30),"Jumlah truk")}${t(`${fm(q.ton)} ton`,`${fm(q.krg)} karung`)}${t(rp(kasInfo(b,h).ak),"Saldo Rekening")}${t(rp(si.akhir),"Sisa tagihan PT")}</div><button onclick="openF()" style="width:100%;padding:16px;border:0;border-radius:16px;background:var(--am);color:#1b1200;font-size:18px;font-weight:700">+ Catat pengiriman</button><button onclick="openG()" style="width:100%;padding:16px;border:0;border-radius:16px;margin-top:10px;background:#2c5b4e;color:#fff;font-size:18px;font-weight:700">+ Catat keuangan</button></div><div class="sum" style="margin-top:12px;padding:18px"><div style="font-size:14px;letter-spacing:.5px;color:#9fb8ae;font-weight:700">SEPANJANG ${S.year}</div><div class="ln" style="font-size:16px"><span>Pengiriman</span><span>${n} (${fm(ton)} ton)</span></div><div class="ln" style="font-size:16px"><span>Total tagihan PT</span><span>${rp(tag)}</span></div><div class="ln" style="font-size:16px"><span>Sudah dibayar PT</span><span>${rp(dibayar)}</span></div><div class="ln t" style="font-size:16px"><span>Sisa tagihan</span><span>${rp(sisaAll)}</span></div></div>`}
function vBmr(){const es=rows("BMR").slice().sort((a,b)=>(b.tgl||"").localeCompare(a.tgl||"")),s=sums(es),si=sisaInfo(S.bln,S.half);
 return `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"><button class="pl" onclick="laporanTransaksi(false)">Lihat PDF</button><button class="pl" onclick="laporanTransaksi(2)">Unduh PDF</button><button class="pl" onclick="laporanTransaksi(true)">Kirim via WA</button></div><div class="sum"><div style="color:#cfd9e4;font-size:13px">Sisa tagihan BMR (kumulatif) · ${BLN[S.bln]} ${S.half==1?"1–15":"16–akhir"}</div><div class="big">${rp(si.akhir)}</div><div class="g"><span>Pengiriman <b>${es.length}</b></span><span>Karung <b>${fm(s.krg)}</b></span><span>Berat <b>${fm(s.ton)} ton</b></span><span>Jumlah truk <b>${fm(s.ton/30)}</b></span><span>Tagihan <b>${rp(s.tag)}</b></span><span>Mutasi <b>${rp(s.mut)}</b></span><span>Dibayar <b>${rp(si.bay)}</b></span><span>Sisa sebelumnya <b>${rp(si.pv)}</b></span><span>Pajak 0,5% <b>${rp(si.pj)}</b></span></div>${tagihanPeriodeHtml()}</div>`+pin("BMR","bayar","Pembayaran periode ini (manual, mengurangi sisa, menambah kas rek)")+`<div class="ln"><span>Pajak 0,5% periode ini (otomatis dari tagihan, mengurangi sisa, masuk Neraca)</span><span>${rp(pajakOf(S.bln,S.half))}</span></div>`+(es.length?es.map(card).join(""):`<div class="empty">Belum ada pengiriman di periode ini.${RO?"":"<br>Ketuk + untuk menambah."}</div>`)}
function vBms(){return '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px"><button class="pl" onclick="laporanKeuangan(false)">Lihat PDF</button><button class="pl" onclick="laporanKeuangan(2)">Unduh PDF</button><button class="pl" onclick="laporanKeuangan(true)">Kirim via WA</button></div><div class="grid">'+vBmsIn()+'</div>'}
async function laporanKeuangan(mode){
 if(!window.jspdf){alert("Library PDF belum dimuat. Periksa koneksi internet lalu coba lagi.");return}

function trxRows(){return rows("BMR").slice().sort((a,b)=>(a.tgl||"").localeCompare(b.tgl||""))}
function trxJudul(){return "LAPORAN TRANSAKSI EXPEDISI PT.MITRA ABADI SAFA - CV. BERKAH MAJU REZEKI"}
function trxPeriode(){return "PERIODE "+(S.half==1?"1–15":"16–AKHIR")+" "+BLN[S.bln].toUpperCase()+" "+S.year}
function trxKolom(){return [
 ["No",8,"c",(e,i)=>String(i+1)],
 ["Tanggal",20,"l",e=>fd(e.tgl)],
 ["Merek",36,"l",e=>e.merek||""],
 ["Pengirim",26,"l",e=>(e.pengirim||"")+(e.pabrik?" ("+e.pabrik+")":"")],
 ["Tujuan",36,"l",e=>e.tujuan||""],
 ["Plat",24,"l",e=>e.plat||""],
 ["Sopir",24,"l",e=>e.sopir||""],
 ["Karung",15,"r",e=>fm(e.karung)],
 ["Ton",13,"r",e=>fm(calc(e).ton)],
 ["Harga/kg",17,"r",e=>rp(e.harga)],
 ["Tagihan",28,"r",e=>rp(calc(e).tag)],
 ["Mutasi",22,"r",e=>rp(e.mutasi)]
]}
async function bagikanPDF(doc,nama,judul,mode){
 const blob=doc.output("blob"),file=new File([blob],nama,{type:"application/pdf"});
 if(mode===false){window.open(URL.createObjectURL(blob),"_blank");return}
 if(mode===2){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nama;document.body.appendChild(a);a.click();a.remove();return}
 if(!navigator.share){alert("Browser ini belum mendukung berbagi. Tekan Unduh PDF, lalu lampirkan file di WhatsApp.");return}
 try{await navigator.share({files:[file],title:judul})}
 catch(e){if(e&&e.name!=="AbortError")alert("Gagal membagikan: "+(e.name||"")+" "+(e.message||"")+". Tekan Unduh PDF, lalu lampirkan file di WhatsApp.")}
}
async function laporanPDF(kirim){
 if(!window.jspdf){alert("Library PDF belum dimuat. Periksa koneksi internet lalu coba lagi.");return}
 const {N,Y}=lapVal(),kn=N.pembayaran-N.pajak-N.ongkos-N.fee-N.operasional,tp=Y.pendapatan+Y.sewa+Y.mutasi+Y.p10,ky=tp-Y.biaya;
 const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
 const R=v=>"Rp "+Math.round(num(v)).toLocaleString("id-ID");
 let y=18;
 const line=(l,v,b)=>{doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(10);doc.text(l,15,y);doc.text(v,195,y,{align:"right"});y+=6.5};
 const head=t=>{y+=3;doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(t,15,y);y+=2;doc.line(15,y,195,y);y+=6};
 doc.addImage(LOGO,"JPEG",15,8,40,28.2);
 doc.setTextColor(0,90,50);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("PT. MITRA ABADI SAFA",15,41);doc.setTextColor(0,0,0);
 doc.setFontSize(15);doc.text("LAPORAN KEUANGAN",105,52,{align:"center"});
 doc.setFontSize(11);doc.text("Tahun "+S.year,105,59,{align:"center"});
 doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text("Dibuat: "+new Date().toLocaleDateString("id-ID"),105,65,{align:"center"});y=76;
 head("NERACA");
 NER.forEach(([k,l])=>line(l,R(N[k])));
 line("Keuntungan bersih usaha ekspedisi",R(kn),true);
 line("Keuntungan bersih (%)",N.pembayaran?(kn/N.pembayaran*100).toFixed(2).replace(".",",")+"%":"-");
 y+=8;
 const blob=doc.output("blob"),nama="Laporan-Keuangan-MAS-"+S.year+".pdf",file=new File([blob],nama,{type:"application/pdf"});
 if(kirim===false){window.open(URL.createObjectURL(blob),"_blank");return}
 if(kirim===2){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nama;document.body.appendChild(a);a.click();a.remove();return}
 if(!navigator.share){alert("Browser ini belum mendukung berbagi. Tekan Unduh PDF, lalu lampirkan file di WhatsApp.");return}
 try{await navigator.share({files:[file],title:"Laporan Keuangan MAS "+S.year})}
 catch(e){if(e&&e.name!=="AbortError")alert("Gagal membagikan: "+(e.name||"")+" "+(e.message||"")+". Tekan Unduh PDF, lalu lampirkan file di WhatsApp.")}
}
async function laporanTransaksi(mode){
 if(!window.jspdf){alert("Library PDF belum dimuat. Periksa koneksi internet lalu coba lagi.");return}
 const doc=new window.jspdf.jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
 const kol=trxKolom(),data=trxRows(),W=297,M=8;
 const cut=(t,w)=>{t=String(t);while(doc.getTextWidth(t)>w-1.5&&t.length>1)t=t.slice(0,-1);return t};
 const head=()=>{doc.addImage(LOGO,"JPEG",M,6,30,21.2);doc.setTextColor(0,0,0);doc.setFont("helvetica","bold");doc.setFontSize(12);doc.text(trxJudul(),W/2,14,{align:"center"});doc.setFontSize(10);doc.text(trxPeriode(),W/2,21,{align:"center"});doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text("Dibuat: "+new Date().toLocaleDateString("id-ID"),W-M,30,{align:"right"});return 34};
 const rowY=(y,vals,bold)=>{let x=M;doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(7);kol.forEach((c,ci)=>{const t=cut(vals[ci],c[1]);const tx=c[2]=="r"?x+c[1]-1:(c[2]=="c"?x+c[1]/2:x+1);doc.text(t,tx,y+3.6,{align:c[2]=="r"?"right":(c[2]=="c"?"center":"left")});x+=c[1]});};
 let y=head();
 const hdr=()=>{doc.setFillColor(20,70,50);doc.rect(M,y,W-2*M,6,"F");doc.setTextColor(255,255,255);rowY(y,kol.map(c=>c[0]),true);doc.setTextColor(0,0,0);y+=6};
 hdr();
 let T={krg:0,ton:0,tag:0,mut:0,f:0,bay:0};
 data.forEach((e,i)=>{if(y>190){doc.addPage();y=head();hdr()}
  const c=calc(e);T.krg+=num(e.karung);T.ton+=c.ton;T.tag+=c.tag;T.mut+=num(e.mutasi);T.f+=num(e.f);T.bay+=num(e.bayar);
  if(i%2){doc.setFillColor(240,246,243);doc.rect(M,y,W-2*M,5.5,"F")}
  rowY(y,kol.map((k,ci)=>k[3](e,i)));y+=5.5});
 if(y>185){doc.addPage();y=head()}
 doc.setDrawColor(20,70,50);doc.line(M,y,W-M,y);y+=0.5;
 rowY(y+1,["","","","","","TOTAL",fm(T.krg),fm(T.ton),"",rp(T.tag),rp(T.mut)],true);
 y+=8; if(y>135){doc.addPage();y=34}
 const yT=y;
 doc.setFont("helvetica","bold");doc.setFontSize(18);
 doc.text("Jumlah pengiriman: "+data.length,M,yT);
 doc.text("Total tagihan + mutasi: "+rp(T.tag+T.mut),M,yT+10);
 const xc=W-M-45,tgl=new Date().toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
 doc.setFont("helvetica","normal");doc.setFontSize(10);
 doc.text("LHOKSEUMAWE, "+tgl,xc,yT,{align:"center"});
 doc.text("HORMAT SAYA",xc,yT+6,{align:"center"});
 doc.addImage(LOGO,"JPEG",xc-13,yT+9,26,18.4);
 doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text("SAYED FAJRIADI",xc,yT+32,{align:"center"});
 const nama="Laporan-Transaksi-"+BLN[S.bln]+"-"+(S.half==1?"1-15":"16-akhir")+"-"+S.year+".pdf";
 await bagikanPDF(doc,nama,"Laporan Transaksi "+trxPeriode(),mode);
}
function vLap(){const {N,Y}=lapVal(),kn=N.pembayaran-N.pajak-N.ongkos-N.fee-N.operasional,tp=Y.pendapatan+Y.sewa+Y.mutasi+Y.p10,ky=tp-Y.biaya;
 const ln=(l,v)=>`<div class="ln"><span>${l}</span><span>${rp(v)}</span></div>`;
 const adj=(k,l)=>`<div class="ln"><span>${l}</span><input type="text" inputmode="text" value="${num((CFG.adj||{})[k])}" ${RO?"disabled":""} onchange="setA('${k}',this.value)"></div>`;
 return `<select class="pl" onchange="setYear(+this.value)" style="margin-bottom:10px">${[2026,2027,2028,2029,2030].map(y=>`<option value="${y}" ${y==S.year?"selected":""}>Tahun ${y}</option>`).join("")}</select><div style="display:flex;gap:8px;margin-bottom:10px"><button class="pl" onclick="laporanPDF(false)">Lihat PDF</button><button class="pl" onclick="laporanPDF(2)">Unduh PDF</button><button class="pl" onclick="laporanPDF(true)">Kirim via WA</button></div><p class="mu">Dihitung otomatis dari BMR dan BMS. Isi pajak di tab Pengiriman, serta bagi hasil dan angka kas di tab Keuangan, untuk setiap periode.</p><h2>Neraca</h2>`+NER.map(([k,l])=>ln(l,N[k])).join("")+`<div class="ln t"><span>Keuntungan bersih usaha ekspedisi</span><span class="${kn>=0?"ok":"bad"}">${rp(kn)}</span></div><div class="ln t"><span>Keuntungan bersih (%)</span><span>${N.pembayaran?fm(kn/N.pembayaran*100):"–"}%</span></div>`
 +`<h2>Saldo awal dan penyesuaian</h2><p class="mu">Angka tetap yang ikut dijumlahkan di rumus Excel. Ubah hanya jika Excel Anda berubah.</p>`+ADJ.map(([k,l])=>adj(k,l)).join("")
 +`<div style="height:24px"></div><h2>Kas YED</h2>`+YED.map(([k,l])=>ln(l,Y[k])).join("")+`<div class="ln t"><span>Total pendapatan</span><span>${rp(tp)}</span></div>`+ln("Biaya perawatan truk dan operasional",Y.biaya)+`<div class="ln t"><span>Keuntungan bersih usaha ekspedisi</span><span class="${ky>=0?"ok":"bad"}">${rp(ky)}</span></div>`}
function vBak(){return `<button class="pl" onclick="firebase.auth().signOut().then(()=>location.reload())">Keluar akun</button><a class="pl" href="ekspor2.html" style="display:block;text-align:center;text-decoration:none;font-weight:600">Unduh Excel (.xlsx)</a><h2>Cadangan data</h2><p class="mu">Data tersimpan di database aplikasi ini dan tampil sama di semua HP yang membukanya. Unduh cadangan berkala sebagai salinan di luar aplikasi.</p>
 <button class="pl" onclick="bakJson()">Unduh cadangan lengkap (JSON)</button><button class="pl" onclick="csv(true)">Unduh semua BMR (CSV)</button><button class="pl" onclick="csv(false)">Unduh BMR periode ini (CSV)</button>
 ${RO?"":`<h2>Pulihkan</h2><p class="mu">Pilih file cadangan JSON. Periode di dalam file akan menggantikan data periode yang sama.</p><input type="file" accept=".json,application/json" onchange="restore(this)">`}`}
async function setA(k,v){if(!db||RO)return;CFG.adj=CFG.adj||{};CFG.adj[k]=num(v);try{await db.doc(CF()).set({adj:CFG.adj});render()}catch(e){toast("Gagal menyimpan.")}}
async function setP(t,k,v){if(!db||RO||busy)return;busy=true;try{const ref=db.doc(PC()+"/"+key(t)),s=await ref.get();const cur=s.exists?s.data():{t,b:S.bln,h:S.half,rows:[]};cur[k]=(v===""?null:num(v));await ref.set(cur);toast("Tersimpan")}catch(e){toast("Gagal menyimpan ("+(e.code||"error")+").")}finally{busy=false}}
function defDate(){return `${S.year}-${String(S.bln+1).padStart(2,"0")}-${S.half==1?"01":"16"}`}
function todayISO(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function transaksiBaru(){localStorage.removeItem("mbs_shared");["f_plat2","f_sopir2","f_pengirim2","f_tujuan2","f_pabrik"].forEach(k=>{const el=document.getElementById(k);if(el)el.value=""});F.forEach(k=>$("#f_"+k).value="");$("#f_tgl").value=todayISO();prev()}
function pengirimOpsi(cur){const set=new Set(["MEDAN"]);Object.values(P).forEach(x=>{if(x.t=="BMR")(x.rows||[]).forEach(r=>{if(r.pengirim)set.add(String(r.pengirim).trim())})});
 const list=[...set].filter(Boolean);list.sort((a,b)=>a==="MEDAN"?-1:b==="MEDAN"?1:a.localeCompare(b));
 const sel=$("#f_pengirim");sel.innerHTML=list.map(n=>`<option value="${n.replace(/"/g,"&quot;")}">${n}</option>`).join("")+'<option value="LAINNYA">LAINNYA (ketik manual)</option>';
 if(cur&&list.includes(cur)){sel.value=cur;$("#f_pengirim2").value=""}else if(cur){sel.value="LAINNYA";$("#f_pengirim2").value=cur}else{sel.value=list[0]||"LAINNYA";$("#f_pengirim2").value=""}
 pengirimCek()}
function selOpsi(selId,manId,set,cur){const sel=$(selId);const list=[...set].filter(Boolean).sort((a,b)=>a.localeCompare(b));
 sel.innerHTML='<option value="">(pilih)</option>'+list.map(n=>`<option value="${n.replace(/"/g,"&quot;")}">${n}</option>`).join("")+'<option value="LAINNYA">LAINNYA (ketik manual)</option>';
 if(cur&&list.includes(cur)){sel.value=cur;$(manId).value=""}else if(cur){sel.value="LAINNYA";$(manId).value=cur}else{sel.value="";$(manId).value=""}
 selCek(selId,manId)}
function selCek(selId,manId){const m=$(manId);if(m)m.style.display=$(selId).value==="LAINNYA"?"":"none"}
function selVal(selId,manId){const v=$(selId).value;return v==="LAINNYA"?$(manId).value.trim():v}
function listOpsi(cp,cs,ct){const pl=new Set(),so=new Set(),tu=new Set();Object.values(P).forEach(x=>{if(x.t=="BMR")(x.rows||[]).forEach(r=>{if(r.plat)pl.add(String(r.plat).trim());if(r.sopir)so.add(String(r.sopir).trim());if(r.tujuan)tu.add(String(r.tujuan).trim())})});
 window.LST={pl,so};selOpsi("#f_plat","#f_plat2",pl,cp||"");selOpsi("#f_sopir","#f_sopir2",so,cs||"");selOpsi("#f_tujuan","#f_tujuan2",tu,ct||"")}
function pengirimVal(){const v=$("#f_pengirim").value;return v==="LAINNYA"?$("#f_pengirim2").value.trim():v}
function pengirimCek(){const l=$("#f_pengirim").value==="LAINNYA";$("#f_pengirim2").style.display=l?"":"none";pabrikCek()}
function pabrikCek(){const m=/MEDAN/i.test(($("#f_pengirim")||{}).value||"");const r=$("#pabrikrow");if(r)r.style.display=m?"":"none"}
function openF(id){if(RO)return;S.edit=id||null;const sh=JSON.parse(localStorage.getItem("mbs_shared")||"{}");const base=id?(rows("BMR").find(x=>x.id==id)||{}):{tgl:todayISO(),pengirim:sh.pengirim||"",pabrik:sh.pabrik||"",plat:sh.plat||"",sopir:sh.sopir||"",harga:sh.harga??"",d:sh.d??"",mutasi:sh.mutasi??"",f:sh.f??""};F.forEach(k=>$("#f_"+k).value=base[k]??"");pengirimOpsi(base.pengirim);listOpsi(base.plat,base.sopir,base.tujuan);pabrikCek();$("#del").style.display=id?"":"none";$("#baru").style.display=id?"none":"";$("#ft").textContent=id?"Ubah pengiriman":"Pengiriman baru";prev();dlg.showModal()}
function autoS(){const pv=selVal("#f_plat","#f_plat2");const p=PLAT.find(x=>x[0].toLowerCase()==pv.toLowerCase());const cur=selVal("#f_sopir","#f_sopir2");if(p&&!cur&&window.LST)selOpsi("#f_sopir","#f_sopir2",window.LST.so,p[1]);selCek("#f_plat","#f_plat2")}
function vals(){const e={};F.forEach(k=>e[k]=$("#f_"+k).value.trim());["karung","harga","mutasi","d","f"].forEach(k=>e[k]=num(e[k]));return e}
function prev(){const e=vals(),c=calc(e);$("#pv").innerHTML=`${fm(c.ton)} ton (${fm(c.kg)} kg)<br>Tagihan ${rp(c.tag)} · Total ${rp(c.total)}`}
async function simpan(){const e=vals();e.pengirim=pengirimVal();e.plat=selVal("#f_plat","#f_plat2");e.sopir=selVal("#f_sopir","#f_sopir2");e.tujuan=selVal("#f_tujuan","#f_tujuan2");if(!/MEDAN/i.test(e.pengirim||""))e.pabrik="";if(!e.tgl||e.karung<=0){alert("Isi tanggal dan jumlah karung.");return}
 const id=S.edit;if(await mut("BMR",r=>id?r.map(x=>x.id==id?{...x,...e}:x):[...r,{id:"n"+Date.now().toString(36),bayar:0,...e}])){if(!id){localStorage.setItem("mbs_shared",JSON.stringify({tgl:$("#f_tgl").value,pengirim:pengirimVal(),pabrik:$("#f_pabrik").value,plat:selVal("#f_plat","#f_plat2"),sopir:selVal("#f_sopir","#f_sopir2"),harga:$("#f_harga").value,d:$("#f_d").value,mutasi:$("#f_mutasi").value,f:$("#f_f").value}));["merek","karung","mutasi","f","ket"].forEach(k=>$("#f_"+k).value="");$("#f_tujuan").value="";$("#f_tujuan2").value="";selCek("#f_tujuan","#f_tujuan2");prev();toast("Tersimpan. Isi pengiriman berikutnya")}else{dlg.close();toast("Tersimpan")}}}
async function hapus(){const id=S.edit;if(confirm("Hapus pengiriman ini?")&&await mut("BMR",r=>r.filter(x=>x.id!=id)))dlg.close()}
function openG(id){if(RO)return;S.edit=id||null;const e=id?rows("BMS").find(x=>x.id==id)||{}:{tgl:todayISO()};$("#g_jenis").innerHTML=JENIS.map(j=>`<option value="${j}">${jl(j)}</option>`).join("");$("#g_tgl").value=e.tgl||"";$("#g_jenis").value=e.jenis||JENIS[0];$("#g_ket").value=e.ket||"";$("#g_jumlah").value=e.jumlah??"";$("#gdel").style.display=id?"":"none";$("#gt").textContent=id?"Ubah catatan":"Catatan keuangan baru";dg.showModal()}
async function simpanG(){const e={tgl:$("#g_tgl").value,jenis:$("#g_jenis").value,ket:$("#g_ket").value.trim(),jumlah:num($("#g_jumlah").value)};if(!e.jumlah){alert("Isi jumlah.");return}
 const id=S.edit;if(await mut("BMS",r=>id?r.map(x=>x.id==id?{...x,...e}:x):[...r,{id:"n"+Date.now().toString(36),...e}])){dg.close();toast("Tersimpan")}}
async function hapusG(){const id=S.edit;if(confirm("Hapus catatan ini?")&&await mut("BMS",r=>r.filter(x=>x.id!=id)))dg.close()}
async function save(name,data){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:name.endsWith(".csv")?"text/csv":"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function bakJson(){save(`cadangan-mbs-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({v:1,periode:P,cfg:CFG}))}
function csv(all){const H=["Periode","No","Tanggal","Merek","Pengirim","Tujuan","Plat","Sopir","Karung","Ton","Kg","Harga","Ongkos per kg","Total ongkos","Tagihan","Mutasi","Dibayar","Total","Keterangan"];const r=[H];
 const ks=Object.keys(P).filter(k=>P[k].t=="BMR"&&(all||k==key("BMR"))).sort((a,b)=>{const x=P[a],y=P[b];return x.b-y.b||x.h-y.h});
 let T={karung:0,ton:0,kg:0,tag:0,ong:0,mut:0,bay:0,tot:0};
 ks.forEach(k=>{const p=P[k];(p.rows||[]).forEach((e,i)=>{const c=calc(e),og=num(e.d),to=c.kg*og;T.karung+=e.karung;T.ton+=c.ton;T.kg+=c.kg;T.tag+=c.tag;T.ong+=to;T.mut+=num(e.mutasi);T.bay+=num(e.bayar);T.tot+=c.total;
  r.push([`${BLN[p.b]} ${p.h==1?"1":"16"}`,i+1,e.tgl,e.merek,e.pengirim,e.tujuan,e.plat,e.sopir,e.karung,c.ton,c.kg,e.harga,og,to,c.tag,e.mutasi,e.bayar,c.total,e.ket])})});
 r.push(["TOTAL","","","","","","","",T.karung,T.ton,T.kg,"",ks.length?"":"",T.ong,T.tag,T.mut,T.bay,T.tot,""]);
 r.push(["","","","","","","","","","","","","","Total keuntungan (tagihan − ongkos)","",""," ",T.tag-T.ong,""]);
 save(all?`bmr-${S.year}-semua.csv`:`bmr-${BLN[S.bln]}-${S.half==1?"1":"16"}.csv`,"\ufeff"+r.map(x=>x.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n"))}
async function restore(inp){const f=inp.files[0];if(!f||!db)return;try{const j=JSON.parse(await f.text()),ids=Object.keys(j.periode||{});if(!ids.length||!confirm(`Pulihkan ${ids.length} periode? Data periode yang sama akan diganti.`))return;
 for(const id of ids)await db.doc(PC()+"/"+id).set(j.periode[id]);if(j.cfg)await db.doc(CF()).set(j.cfg);toast("Pemulihan selesai")}catch(e){toast("File cadangan tidak valid atau gagal ditulis.")}inp.value=""}
$("#sy").value=S.year;$("#sy").onchange=e=>setYear(+e.target.value);
$("#sb").innerHTML=BLN.map((m,i)=>`<option value="${i}">${m}</option>`).join("");
$("#sb").onchange=e=>{S.bln=+e.target.value;render()};$("#sh").onchange=e=>{S.half=+e.target.value;render()};
$("#dm").innerHTML=MEREK.map(x=>`<option value="${esc(x)}">`).join("");$("#dt").innerHTML=TUJ.map(x=>`<option value="${esc(x)}">`).join("");$("#dp").innerHTML=PLAT.map(x=>`<option value="${x[0]}">${esc(x[1])}</option>`).join("");
render();
function startSync(){if(startSync.d)return;startSync.d=1;
 const fx=firebase.firestore();try{fx.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
 const wrap=s=>({exists:s.exists,data:()=>s.data()});
 db={doc:p=>{const r=fx.doc(p);return{get:async()=>wrap(await r.get()),set:d=>{r.set(d).catch(e=>toast("Gagal menyimpan ke server ("+(e.code||"error")+")"));return Promise.resolve()},onSnapshot:(n,e)=>r.onSnapshot(x=>n(wrap(x)),e)}},collection:p=>{const c=fx.collection(p);return{onSnapshot:(n,e)=>c.onSnapshot(x=>n({docs:x.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)}}};
 render();
 subscribeYear();}
let UNS=[];
function subscribeYear(){UNS.forEach(u=>{try{u()}catch(e){}});UNS=[];P={};CFG={};ready=false;
 UNS.push(db.collection(PC()).onSnapshot(s=>{P={};s.docs.forEach(d=>{const x=d.data();if(x)P[`${x.t}-${x.b}-${x.h}`]=x});ready=true;render()},()=>toast("Sinkronisasi terputus. Muat ulang halaman.")));
 UNS.push(db.doc(CF()).onSnapshot(s=>{if(s.exists){CFG=s.data();if(S.tab=="lap"&&!(document.activeElement&&document.activeElement.matches("input")))render()}},()=>{}));render()}
function setYear(y){S.year=y;S.edit=null;if(db)subscribeYear();else render()}
async function masuk(){try{await firebase.auth().signInWithEmailAndPassword($("#l_em").value.trim(),$("#l_pw").value)}catch(e){$("#l_err").textContent="Email atau kata sandi salah."}}
addEventListener("online",render);addEventListener("offline",render);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(!window.firebase||!window.FIREBASE_CONFIG||/^ISI/.test(FIREBASE_CONFIG.apiKey||"ISI")){toast("Isi file firebase-config.js terlebih dahulu.")}
else{firebase.initializeApp(FIREBASE_CONFIG);firebase.auth().onAuthStateChanged(u=>{if(u){if($("#lg").open)$("#lg").close();startSync()}else{render();$("#lg").showModal()}})}
document.getElementById("hlogo").src=LOGO;
</script></body></html>
